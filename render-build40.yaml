services:
  - type: web
    name: fortune-site
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fortune-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DETAIL_PRICE_YEN
        value: "980"
      - key: MEMBERSHIP_PRICE_YEN
        value: "490"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CSRF_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false

databases:
  - name: fortune-db
    plan: free
