<h2 id="nameDataSourcesTitle">姓名判断の文字データについて</h2>
<p>漢字の基礎画数データには EDRDG の KANJIDIC2 を利用します。KANJIDIC2 は Creative Commons Attribution-ShareAlike 4.0 の条件で提供されています。</p>
<p>本サービスでは現代表記・通常画数方式を採用します。KANJIDIC2の仕様に従って先頭の <code>stroke_count</code> を採用画数とし、後続値は一般的な誤画数の監査情報として保持します。旧字体・異体字への自動変換は行いません。未確認文字は要確認として停止します。</p>
