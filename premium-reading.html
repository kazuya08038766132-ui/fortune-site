<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>詳細鑑定｜総合占い</title><link rel="stylesheet" href="fortune-site-build40.css?v=189"></head><body data-release="SPEC327-BUILD-40-RC278"><a class="skip-link" href="#main">本文へ移動</a><header class="topbar"><div class="shell nav"><a class="brand" href="/">総合占い</a><nav class="navlinks"><a class="keep" href="mypage.html">マイページ</a></nav></div></header><main id="main" class="page"><div class="shell"><section class="card page-card"><div class="eyebrow">Premium Reading</div><h1>総合詳細鑑定</h1><div id="state" aria-live="polite" class="status warn">支払い済み鑑定を読み込んでいます。</div><div id="body" class="result-grid" style="margin-top:20px"></div><div class="devmark">account-owned paid API only / SPEC327-BUILD-40-RC278</div></section></div><footer class="shell" style="padding:24px 0 40px"><p class="legal"><a href="/terms.html">利用規約</a> ／ <a href="/privacy.html">プライバシー</a> ／ <a href="/tokusho.html">特定商取引法に基づく表記</a></p></footer></main><script type="module">import {fetchFirstPartySafe as fetchSafe,readFirstPartyJson as readJsonSafe} from './browser-api-safe-build40.js?v=223';
import {renderIntegratedReport} from './integrated-report-view-build40.js?v=187';
const id=new URLSearchParams(location.search).get('order_id'),state=document.querySelector('#state'),body=document.querySelector('#body');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
if(!id){state.className='status bad';state.textContent='注文IDがありません。';}else{try{const r=await fetchSafe('/api/my-order-reading/'+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store'});const j=await readJsonSafe(r);if(!r.ok){state.className=r.status===403?'status warn':'status bad';state.textContent=r.status===403?'この鑑定はまだ支払い済みとして確認できません。':'鑑定を取得できません。';}else{state.className='status ok';state.textContent='支払い済みの鑑定を表示しています。';const d=j.reading||{},pb=d.premiumBirth||{},pn=d.premiumName||{},ig=d.integrated||{};const cards=[];const integratedHtml=renderIntegratedReport(ig,{palmReading:d.palmReading||d.palm?.reading||null});if(ig.reportQuality?.status==='FAIL'){console.warn('paid report quality gate',ig.reportQuality.issues||[]);}if(ig.status==='SUPPORTED'){cards.push({title:ig.headline,value:'総合',text:ig.summary});if(ig.portrait?.status==='SUPPORTED')cards.push({title:ig.portrait.headline||'総合人物像',value:'人物像',text:ig.portrait.text});const paid=ig.paidDisplay;if(paid?.status==='SAFE_FALLBACK'){cards.push({title:'総合鑑定',value:'品質保護版',text:paid.opening});for(const x of paid.sections||[])cards.push({title:x.label,value:'確認済み根拠から再構成',text:x.text});if(paid.closing)cards.push({title:'今回の鑑定のまとめ',value:'まとめ',text:paid.closing});for(const x of paid.sourceNotes||[])cards.push({title:`${x.label}の鑑定根拠`,value:'根拠',text:x.text});}else if(paid?.status==='SUPPORTED'||ig.reportQuality?.status==='PASS'&&ig.editorial?.status==='SUPPORTED'){const ed=paid||ig.editorial;cards.push({title:'総合鑑定',value:'読み解き',text:ed.opening});for(const x of ed.sections||[])cards.push({title:x.label,value:'テーマ',text:x.text});if(ed.closing)cards.push({title:'今回の鑑定のまとめ',value:'まとめ',text:ed.closing});for(const x of ed.sourceNotes||[])cards.push({title:`${x.label}の鑑定根拠`,value:'根拠',text:x.text});}else{if(ig.story?.status==='SUPPORTED'){cards.push({title:ig.story.headline||'総合鑑定ストーリー',value:'総合',text:ig.story.opening});for(const x of ig.story.sections||[])cards.push({title:x.label,value:'読み解き',text:x.text});cards.push({title:'今回の鑑定のまとめ',value:'まとめ',text:ig.story.closing});}for(const x of ig.themes||[])cards.push({title:x.label,value:'統合',text:x.text});for(const x of ig.domains||[])if(x.status==='SUPPORTED'){const common=(x.commonSignals||[]).map(v=>v.label).join('・');const distinct=(x.distinctSignals||[]).map(v=>`${v.label}：${(v.concepts||[]).map(c=>c.label).join('・')||v.signals?.slice(0,1).join('・')||''}`).join(' ／ ');cards.push({title:x.label,value:'横断鑑定',text:`${x.feature||x.summary}${common?` 共通点：${common}`:''}${distinct?` 占術ごとの違い：${distinct}`:''} 強み：${x.strength||''} 注意点：${x.caution||''} 活かし方：${x.action||''}`});}for(const x of ig.evidence||[])cards.push({title:`${x.label}の根拠`,value:'確認済み',text:x.summary});}}else{cards.push({title:'総合鑑定',value:'個別表示',text:ig.summary||'検証済みの占術が2種類以上そろうまで、占術をまたぐ総合判断は行いません。'});}cards.push(...(pb.premiumCards||[]));if(pn.status==='OK'){const g=pn.fiveGrid;cards.push({title:'姓名判断・五格',value:`天${g.heaven} / 人${g.person} / 地${g.earth} / 外${g.outer} / 総${g.total}`,text:'支払い確認後にサーバー側で姓名を再計算しました。'});for(const x of pn.numerology?.entries||[])cards.push({title:`${x.label}・${x.theme}`,value:`${x.number}画 ${x.rating}`,text:`${x.role} ${x.advice}`});}else if(['MASTER_NOT_PRESENT','MASTER_GATE_FAILED','MASTER_LOAD_ERROR'].includes(pn.status)){cards.push({title:'姓名判断',value:'準備中',text:'公式画数masterが未昇格のため、姓名結果は推測せず保留しています。'});}body.innerHTML=integratedHtml+(cards.length?cards.filter(c=>!String(c.title||'').includes('総合')&&!String(c.title||'').includes('鑑定根拠')).map(c=>`<article class="card result-card"><h3>${esc(c.title)} <span class="pill">${esc(c.value)}</span></h3><p>${esc(c.text)}</p></article>`).join(''):'');}}catch(e){state.className='status bad';state.textContent='鑑定APIへ接続できませんでした。';}}
</script></body></html>
