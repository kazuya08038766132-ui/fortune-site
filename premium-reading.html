<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>詳細鑑定｜総合占い</title>
<style>body{margin:0;background:#100b25;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:780px;margin:auto;padding:20px}.chapter{background:#fffdf7;color:#241532;border:1px solid #d8b35a;border-radius:16px;padding:18px;margin:14px 0}.technical{background:#f2e8ff;color:#321269;border-radius:10px;padding:12px}.notice{background:#2b1751;border:1px solid #d8b35a;padding:10px;border-radius:10px}a{color:#ffe49a}</style></head><body><main class="wrap">
<p><a href="/mypage.html">← マイページ</a></p><div class="notice">開発確認：SPEC195-BUILD-35｜¥980詳細鑑定11章</div><h1>総合詳細鑑定</h1><div id="app">鑑定結果を確認しています…</div></main>
<script>
const CH=["Ⅰ あなたという人","Ⅱ 運命バランス","Ⅲ 掌","Ⅳ 姓名","Ⅴ 生年月日","Ⅵ 仕事と才能","Ⅶ 財と金運","Ⅷ 愛情・人間関係","Ⅸ 人生の転機","Ⅹ 二つの手","最終章 三占術統合"];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function normalize(x){if(Array.isArray(x))return x;if(Array.isArray(x?.chapters))return x.chapters;if(Array.isArray(x?.premium))return x.premium;return[]}
async function boot(){const id=new URLSearchParams(location.search).get("order_id");if(!id){document.getElementById("app").innerHTML="<p>鑑定IDがありません。</p>";return}
try{const r=await fetch("/api/my-order-reading/"+encodeURIComponent(id),{credentials:"same-origin"});const j=await r.json();if(r.status===403){document.getElementById("app").innerHTML="<p>この鑑定を表示する権限を確認できません。</p>";return}if(!r.ok)throw new Error(j.error);
const raw=j.reading||{},chs=normalize(raw);let html="";
for(let i=0;i<11;i++){const c=chs[i]||{},title=c.title||CH[i],text=c.text||c.body||c.content||"この章は鑑定データ生成待ちです。";html+=`<section class="chapter"><h2>${esc(title)}</h2>${i===4&&c.technical?`<div class="technical"><b>命式データ</b><p>${esc(c.technical)}</p></div>`:""}<p>${esc(text)}</p></section>`}
document.getElementById("app").innerHTML=html}catch(e){document.getElementById("app").innerHTML="<p>鑑定結果を取得できませんでした。しばらくして再読み込みしてください。</p>"}}
boot();
</script></body></html>
