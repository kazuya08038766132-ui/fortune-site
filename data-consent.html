<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>同意・データ管理｜総合占い</title><script src="/spec195-client.js"></script>
<style>body{margin:0;background:linear-gradient(180deg,#080821,#150b37);color:#f4f0ff;font-family:system-ui;line-height:1.75}.w{max-width:760px;margin:auto;padding:28px 18px 80px}a{color:#f3d986}.box{background:#17113de8;border:1px solid #8e743b;border-radius:18px;padding:20px;margin:16px 0}h1,h2{color:#f3d986}.btn{padding:12px 16px;border:0;border-radius:12px;background:#7047d9;color:#fff}.small{color:#bbb}</style></head>
<body><main class="w"><a href="/mypage.html">← マイページ</a><h1>同意・データ管理</h1><p class="small">開発確認：SPEC195-BUILD-33 ｜ AI学習は初期OFF・通常鑑定と別同意</p>
<section class="box"><h2>手相画像のAI学習利用</h2><p>通常の手相鑑定に必要な利用と、AI学習への利用は別管理です。AI学習は初期状態ではOFFです。</p>
<p id="state">状態を確認しています…</p><button class="btn" id="toggle">変更する</button></section>
<section class="box"><h2>保持方針</h2><p>鑑定用の手相原本は30日保持を基本方針とし、AI学習用は明示的な同意がある場合のみ別目的として管理します。実ストレージ連携が未完了の間は、保存済みと表示しません。</p></section>
<script>
let current=false;
async function load(){try{const r=await fetch('/api/my-consents',{credentials:'same-origin'}),j=await r.json();if(!r.ok)throw Error(j.error);const e=(j.events||[]).find(x=>x.consent_type==='PALM_AI_TRAINING');current=e?.accepted===true;state.textContent=current?'AI学習：同意中':'AI学習：OFF'}catch(e){state.textContent='状態を取得できません'}}
toggle.onclick=async()=>{try{const token=await Spec195.csrfToken(),r=await fetch('/api/my-consents',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':token},body:JSON.stringify({consent_type:'PALM_AI_TRAINING',accepted:!current,policy_version:'SPEC195-PRIVACY-V1'})}),j=await r.json();if(!r.ok)throw Error(j.error);await load()}catch(e){alert('変更できませんでした')}}
load();
</script></main></body></html>
