<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>返金・キャンセルについて｜総合占い</title><style>body{margin:0;background:#090b24;color:#eee;font-family:system-ui;line-height:1.8}main{max-width:820px;margin:auto;padding:82px 22px 60px}a{color:#f3d986}h1,h2{color:#f3d986}.box{background:#151039;border:1px solid #7e6837;border-radius:16px;padding:20px;margin:18px 0}.nav{position:fixed;top:0;left:0;right:0;padding:16px 22px;background:#090b24ee;border-bottom:1px solid #594b2d}small{color:#aaa}</style></head><body><div class="nav"><a href="/">← 総合占いへ戻る</a></div><main><h1>返金・キャンセルについて</h1><div class="box"><h2>詳細鑑定（980円）</h2><p>デジタルコンテンツの性質上、提供開始後の利用者都合によるキャンセル・返金の取扱いは、購入前に表示する条件に従います。二重課金やシステム障害などの場合は問い合わせ窓口で確認します。</p><h2>月額会員（490円/月）</h2><p>解約は会員管理画面から行います。解約時点以降の更新停止時期や既払料金の扱いは、決済画面および会員管理画面の表示に従います。</p></div><p><small>最終更新：2026年9月</small></p></main></body></html>
