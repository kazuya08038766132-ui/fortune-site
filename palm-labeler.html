<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palm AI Ground Truth Studio v4</title><style>
*{box-sizing:border-box}body{font-family:system-ui;background:#0b0e1b;color:#fff;margin:0}.w{max-width:1280px;margin:auto;padding:10px}.p{background:#171c31;border:1px solid #4e587e;border-radius:14px;padding:11px;margin:9px 0}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:7px}.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1}button,select,input{font:inherit;padding:9px;border-radius:9px;border:1px solid #737da5}button{background:#6247aa;color:#fff;font-weight:700}button.on{outline:3px solid #fff}.small{font-size:12px;opacity:.82}.v{height:min(72vh,820px);overflow:auto;background:#03050a;border-radius:12px;touch-action:pan-x pan-y}.s{position:relative;transform-origin:0 0;width:max-content;height:max-content}canvas{display:block;max-width:none}.o,.ai{position:absolute;inset:0}.o{touch-action:none}.ai{pointer-events:none;opacity:.38}.b{display:inline-block;background:#252c4a;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px}input[type=range]{padding:2px;width:100%}.ok{color:#72ef9d}
</style></head><body><div class="w"><h2>Palm AI Ground Truth Studio v4</h2><div class="p"><div class="r"><button id="back">← 占いサイトへ戻る</button><input id="file" type="file" accept="image/*"></div><div id="info" class="small">原寸写真を画素単位で編集します。</div></div>
<div class="p g"><select id="klass"><option value="2">生命線</option><option value="3">知能線</option><option value="4">感情線</option><option value="5">運命線</option><option value="6">太陽線</option><option value="7">水星線</option><option value="8">火星線</option><option value="9">金星帯</option><option value="10">結婚線</option><option value="1">その他/未分類</option></select><button id="draw" class="on">描く</button><button id="erase">消す</button><button id="undo">戻す</button><button id="clear">全消去</button><button id="ait">AI下敷き</button><button id="mt">正解線表示</button></div>
<div class="p"><div class="r"><label>線幅 <b id="bo">2</b>px<input id="brush" type="range" min="1" max="10" value="2"></label><label>倍率 <b id="zo">100</b>%<input id="zoom" type="range" min="50" max="500" step="10" value="100"></label><label>AI濃度 <b id="ao">38</b>%<input id="alpha" type="range" min="0" max="100" value="38"></label></div><span id="res" class="b">未読込</span><span class="b">原寸Blob</span><span class="b">最大500%</span><span class="b">1pxペン</span><span class="b">class-id画素マスク</span></div>
<div class="p"><div class="v"><div id="stage" class="s"><canvas id="photo"></canvas><canvas id="ai" class="ai"></canvas><canvas id="mask" class="o"></canvas></div></div></div>
<div class="p r"><button id="save">正解確定</button><button id="pm">マスクPNG</button><button id="pj">メタJSON</button></div><div class="p"><b>保存件数：</b><span id="count">0</span> <span id="status" class="small"></span><div class="small">PNGは8bit grayscale。画素値=class_id。消しゴムは0を書き込むため教師データに反映されます。</div></div></div>
<script>
const q=s=>document.querySelector(s),P=q('#photo'),px=P.getContext('2d'),A=q('#ai'),ax=A.getContext('2d'),M=q('#mask'),mx=M.getContext('2d'),S=q('#stage');const C={1:[255,255,255],2:[53,224,111],3:[57,167,255],4:[255,76,99],5:[181,108,255],6:[255,216,77],7:[57,229,232],8:[255,141,66],9:[255,99,215],10:[157,255,139]},N={0:'background',1:'unknown_crease',2:'life',3:'head',4:'heart',5:'fate',6:'sun',7:'mercury',8:'mars',9:'girdle_of_venus',10:'relationship'};let img,name='palm.jpg',mode='draw',down=0,last,mask,hist=[],meta=null,aiOn=1,mOn=1,saved=0;
function db(){return new Promise((ok,ng)=>{let r=indexedDB.open('fortune-palm-ai',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('handoff'))r.result.createObjectStore('handoff')};r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)})}async function blob(){let d=await db();let v=await new Promise((ok,ng)=>{let r=d.transaction('handoff').objectStore('handoff').get('originalPhoto');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});d.close();return v}
function load(src,n){let im=new Image;im.onload=()=>{img=im;name=n||name;P.width=A.width=M.width=im.naturalWidth;P.height=A.height=M.height=im.naturalHeight;S.style.width=P.width+'px';S.style.height=P.height+'px';px.drawImage(im,0,0);mask=new Uint8Array(P.width*P.height);hist=[];q('#res').textContent=P.width+' × '+P.height+'px';q('#info').innerHTML='<span class="ok">原寸 '+P.width+'×'+P.height+'px を保持。</span> 学習時だけ縮小します。';pred();z();render()};im.src=src}function loadBlob(b,n){let u=URL.createObjectURL(b);load(u,n);setTimeout(()=>URL.revokeObjectURL(u),5000)}q('#file').onchange=()=>{let f=q('#file').files[0];if(f)loadBlob(f,f.name)};q('#back').onclick=()=>location.href='/';
(async()=>{try{let r=localStorage.getItem('palmLabelerMeta');if(r)meta=JSON.parse(r);let b=await blob();if(b)return loadBlob(b,meta?.original_name);let old=localStorage.getItem('palmLabelerPhoto');if(old)load(old,'legacy.jpg')}catch(e){console.warn(e)}})();
function pred(){ax.clearRect(0,0,A.width,A.height);let p=localStorage.getItem('palmLabelerPreview');if(!p)return;let im=new Image;im.onload=()=>ax.drawImage(im,0,0,A.width,A.height);im.src=p}function z(){let v=+q('#zoom').value/100;S.style.transform=`scale(${v})`;S.style.marginRight=P.width*(v-1)+'px';S.style.marginBottom=P.height*(v-1)+'px';q('#zo').textContent=q('#zoom').value}q('#zoom').oninput=z;q('#brush').oninput=()=>q('#bo').textContent=q('#brush').value;q('#alpha').oninput=()=>{A.style.opacity=+q('#alpha').value/100;q('#ao').textContent=q('#alpha').value};
function render(){mx.clearRect(0,0,M.width,M.height);if(!mask||!mOn)return;let im=mx.createImageData(M.width,M.height),d=im.data;for(let i=0;i<mask.length;i++){let k=mask[i];if(!k)continue;let c=C[k]||C[1],j=i*4;d[j]=c[0];d[j+1]=c[1];d[j+2]=c[2];d[j+3]=235}mx.putImageData(im,0,0)}function pos(e){let r=M.getBoundingClientRect();return{x:(e.clientX-r.left)*M.width/r.width,y:(e.clientY-r.top)*M.height/r.height}}function stamp(x,y,k,w){let R=Math.max(.5,w/2),x0=Math.max(0,~~(x-R)),x1=Math.min(M.width-1,Math.ceil(x+R)),y0=Math.max(0,~~(y-R)),y1=Math.min(M.height-1,Math.ceil(y+R));for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)if((xx-x)**2+(yy-y)**2<=R*R)mask[yy*M.width+xx]=k}function seg(a,b,k,w){let dx=b.x-a.x,dy=b.y-a.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)));for(let i=0;i<=n;i++){let t=i/n;stamp(a.x+dx*t,a.y+dy*t,k,w)}}
M.onpointerdown=e=>{if(!img)return;e.preventDefault();M.setPointerCapture(e.pointerId);hist.push(mask.slice());if(hist.length>20)hist.shift();down=1;last=pos(e);seg(last,last,mode==='erase'?0:+q('#klass').value,+q('#brush').value);render()};M.onpointermove=e=>{if(!down)return;e.preventDefault();let p=pos(e);seg(last,p,mode==='erase'?0:+q('#klass').value,mode==='erase'?Math.max(4,+q('#brush').value*2):+q('#brush').value);last=p;render()};M.onpointerup=M.onpointercancel=()=>down=0;
q('#draw').onclick=()=>{mode='draw';q('#draw').classList.add('on');q('#erase').classList.remove('on')};q('#erase').onclick=()=>{mode='erase';q('#erase').classList.add('on');q('#draw').classList.remove('on')};q('#undo').onclick=()=>{let v=hist.pop();if(v){mask=v;render()}};q('#clear').onclick=()=>{if(mask){hist.push(mask.slice());mask.fill(0);render()}};q('#ait').onclick=()=>{aiOn=!aiOn;A.style.display=aiOn?'block':'none'};q('#mt').onclick=()=>{mOn=!mOn;render()};
function png(){let c=document.createElement('canvas');c.width=M.width;c.height=M.height;let x=c.getContext('2d'),im=x.createImageData(c.width,c.height);for(let i=0;i<mask.length;i++){let j=i*4,k=mask[i];im.data[j]=im.data[j+1]=im.data[j+2]=k;im.data[j+3]=255}x.putImageData(im,0,0);return c}function dl(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function base(){return name.replace(/\.[^.]+$/,'').replace(/[^\w.-]+/g,'_')}function md(){let pc={};for(let k of mask)if(k)pc[k]=(pc[k]||0)+1;return{schema:'palm-ground-truth-v4',image_name:name,width:M.width,height:M.height,created_at:new Date().toISOString(),review_status:'human_corrected',model_version:meta?.model_version||'unknown',handedness:meta?.hand||'unknown',label_map:N,pixel_counts:pc,mask_encoding:'8-bit grayscale PNG; pixel value = class_id',handoff:meta}}
q('#save').onclick=()=>{if(!img)return;saved++;q('#count').textContent=saved;q('#status').textContent='正解を確定しました。PNG+JSONを書き出してください。'};q('#pm').onclick=()=>png().toBlob(b=>dl(b,base()+'_mask.png'),'image/png');q('#pj').onclick=()=>dl(new Blob([JSON.stringify(md(),null,2)],{type:'application/json'}),base()+'_meta.json');
</script></body></html>
