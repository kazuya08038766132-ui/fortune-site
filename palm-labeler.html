<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palm AI Hi-Res Ground Truth Labeler v3</title>
<style>
*{box-sizing:border-box} body{font-family:system-ui,-apple-system,sans-serif;background:#0d1020;color:#fff;margin:0}
.wrap{max-width:1180px;margin:auto;padding:12px}.panel{background:#181d34;border:1px solid #4e577d;border-radius:14px;padding:12px;margin:10px 0}
h1{font-size:20px;margin:4px 0 10px}.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
button,select,input{font:inherit;padding:10px;border-radius:10px;border:1px solid #727ca5}button{background:#6247aa;color:#fff;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{opacity:.8;font-size:12px}.strong{font-weight:800}
.viewport{height:min(70vh,760px);overflow:auto;background:#05060b;border-radius:12px;touch-action:pan-x pan-y}
.stage{position:relative;transform-origin:0 0;width:max-content;height:max-content}
canvas{display:block;max-width:none;touch-action:none}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#252c4c;margin:2px 4px 2px 0;font-size:12px}
input[type=range]{padding:4px;width:100%}
</style></head><body><div class="wrap">
<h1>Palm AI 高解像度 Ground Truth Labeler v3</h1>
<div class="panel"><div class="row"><button id="back">← 占いサイトへ戻る</button><input id="file" type="file" accept="image/*"></div>
<div id="info" class="small">元画像を高解像度のまま読み込みます。細いシワは拡大して確認してください。</div></div>

<div class="panel toolbar">
<select id="klass"><option value="2">生命線</option><option value="3">頭脳線</option><option value="4">感情線</option><option value="5">運命線</option><option value="6">太陽線</option><option value="7">水星線</option><option value="8">火星線</option><option value="9">金星帯</option><option value="10">結婚線</option><option value="1">その他/未分類</option></select>
<button id="draw">描く</button><button id="erase">消す</button><button id="undo">1つ戻す</button><button id="clear">全消去</button>
</div>
<div class="panel">
<div class="row"><label>線幅 <span id="brushOut" class="strong">3</span>px<input id="brush" type="range" min="1" max="12" value="3"></label>
<label>表示倍率 <span id="zoomOut" class="strong">100</span>%<input id="zoom" type="range" min="50" max="400" step="10" value="100"></label></div>
<div><span class="badge" id="res">未読込</span><span class="badge">1〜12px精密ペン</span><span class="badge">最大400%表示</span></div>
</div>

<div class="panel"><div id="viewport" class="viewport"><div id="stage" class="stage"><canvas id="photo"></canvas><canvas id="overlay" style="position:absolute;left:0;top:0"></canvas></div></div></div>

<div class="panel row"><button id="save">正解データを保存</button><button id="export">教師データZIP相当を書き出す</button></div>
<div class="panel"><b>保存件数：</b><span id="count">0</span><div id="status" class="small"></div></div>
</div>
<script>
const photo=document.querySelector('#photo'), px=photo.getContext('2d');
const ov=document.querySelector('#overlay'), ox=ov.getContext('2d',{willReadFrequently:true});
const stage=document.querySelector('#stage'), viewport=document.querySelector('#viewport'), file=document.querySelector('#file');
const brush=document.querySelector('#brush'),zoom=document.querySelector('#zoom');
const colors={1:'#ffffff',2:'#35e06f',3:'#39a7ff',4:'#ff4c63',5:'#b56cff',6:'#ffd84d',7:'#39e5e8',8:'#ff8d42',9:'#ff63d7',10:'#9dff8b'};
let img=null,mode='draw',active=null,history=[],records=[],handoffMeta=null,imageName='site-handoff.jpg';

function setZoom(){const z=+zoom.value/100;stage.style.transform=`scale(${z})`;stage.style.marginRight=`${photo.width*(z-1)}px`;stage.style.marginBottom=`${photo.height*(z-1)}px`;document.querySelector('#zoomOut').textContent=zoom.value}
zoom.oninput=setZoom; brush.oninput=()=>document.querySelector('#brushOut').textContent=brush.value;

function snapshot(){history.push(ox.getImageData(0,0,ov.width,ov.height));if(history.length>30)history.shift()}
function loadSrc(src,name='site-handoff.jpg'){
 const im=new Image(); im.onload=()=>{
  img=im; imageName=name; photo.width=ov.width=im.naturalWidth;photo.height=ov.height=im.naturalHeight;
  stage.style.width=im.naturalWidth+'px';stage.style.height=im.naturalHeight+'px';
  px.clearRect(0,0,photo.width,photo.height);px.drawImage(im,0,0);ox.clearRect(0,0,ov.width,ov.height);history=[];
  document.querySelector('#res').textContent=`${im.naturalWidth} × ${im.naturalHeight}px`;
  document.querySelector('#info').textContent=`原寸 ${im.naturalWidth}×${im.naturalHeight}px。画像自体は縮小せず、表示だけズームします。`;
  setZoom();
 };im.src=src
}
file.onchange=()=>{const f=file.files[0];if(!f)return;const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>{loadSrc(u,f.name);setTimeout(()=>URL.revokeObjectURL(u),2000)};im.src=u}
document.querySelector('#back').onclick=()=>location.href='/';

try{
 const raw=localStorage.getItem('palmLabelerMeta');if(raw)handoffMeta=JSON.parse(raw);
 const photoSrc=localStorage.getItem('palmLabelerPhoto'),preview=localStorage.getItem('palmLabelerPreview');
 if(photoSrc)loadSrc(photoSrc,'site-handoff.jpg');else if(preview)loadSrc(preview,'analysis-preview.jpg');
}catch(e){console.warn(e)}

function pt(e){const r=ov.getBoundingClientRect();return{x:(e.clientX-r.left)*ov.width/r.width,y:(e.clientY-r.top)*ov.height/r.height}}
function begin(e){
 if(!img)return;e.preventDefault();ov.setPointerCapture(e.pointerId);snapshot();active=pt(e);
 ox.globalCompositeOperation=mode==='erase'?'destination-out':'source-over';ox.strokeStyle=colors[+document.querySelector('#klass').value];
 ox.lineWidth=mode==='erase'?Math.max(6,+brush.value*3):+brush.value;ox.lineCap='round';ox.lineJoin='round';ox.beginPath();ox.moveTo(active.x,active.y)
}
function move(e){if(!active)return;e.preventDefault();const p=pt(e);ox.lineTo(p.x,p.y);ox.stroke();active=p}
function end(){active=null;ox.globalCompositeOperation='source-over'}
ov.onpointerdown=begin;ov.onpointermove=move;ov.onpointerup=end;ov.onpointercancel=end;
document.querySelector('#draw').onclick=()=>mode='draw';document.querySelector('#erase').onclick=()=>mode='erase';
document.querySelector('#undo').onclick=()=>{const s=history.pop();if(s)ox.putImageData(s,0,0)};
document.querySelector('#clear').onclick=()=>{if(!img)return;snapshot();ox.clearRect(0,0,ov.width,ov.height)};

function maskDataURL(){
 const m=document.createElement('canvas');m.width=ov.width;m.height=ov.height;const mx=m.getContext('2d');
 mx.drawImage(ov,0,0);return m.toDataURL('image/png')
}
document.querySelector('#save').onclick=()=>{
 if(!img)return alert('写真を読み込んでください');
 records.push({schema:'palm-ground-truth-v3-hires',image_name:imageName,width:ov.width,height:ov.height,created_at:new Date().toISOString(),source:'developer_corrected',handoff:handoffMeta,mask_png:maskDataURL()});
 document.querySelector('#count').textContent=records.length;document.querySelector('#status').textContent='高解像度の訂正マスクを保存しました。消しゴム結果も画素に反映されています。'
};
document.querySelector('#export').onclick=()=>{
 if(!records.length)return alert('保存データがありません');
 const payload={schema:'palm-teacher-batch-v3-hires',note:'Masks are full-resolution PNG data URLs. Resize only during model training.',label_map:{1:'unknown_crease',2:'life',3:'head',4:'heart',5:'fate',6:'sun',7:'mercury',8:'mars',9:'girdle_of_venus',10:'relationship'},records};
 const b=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='palm_teacher_hires.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
};
</script></body></html>
