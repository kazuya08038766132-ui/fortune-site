<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palm AI Developer Labeler</title>
<style>
body{font-family:system-ui;background:#101326;color:#fff;margin:0}.wrap{max-width:900px;margin:auto;padding:16px}
.panel{background:#1b2038;border:1px solid #555d86;border-radius:16px;padding:14px;margin:12px 0}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
button,select,input{font:inherit;padding:11px;border-radius:10px;border:1px solid #737ba1}
button{background:#6247aa;color:#fff}canvas{width:100%;height:auto;touch-action:none;background:#05060c;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{opacity:.75;font-size:13px}
</style></head><body><div class="wrap"><h1>Palm AI Developer Labeler</h1>
<div class="panel"><input id="file" type="file" accept="image/*"><p class="small">写真を読み込み、線種を選び、指/マウスで正解線を描画します。</p></div>
<div class="panel toolbar">
<select id="klass"><option value="2">生命線</option><option value="3">頭脳線</option><option value="4">感情線</option><option value="5">運命線</option><option value="6">太陽線</option><option value="7">水星線</option><option value="8">火星線</option><option value="9">金星帯</option><option value="10">結婚線</option><option value="1">その他/未分類</option></select>
<button id="draw">描く</button><button id="erase">消す</button><button id="undo">1つ戻す</button><button id="clear">全消去</button>
</div><div class="panel"><canvas id="c"></canvas></div>
<div class="panel row"><button id="save">正解データとして保存</button><button id="export">教師データJSONを書き出す</button></div>
<div class="panel"><b>保存件数：</b><span id="count">0</span><div id="status" class="small"></div></div>
</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),file=document.querySelector('#file');
let img=null,mode='draw',strokes=[],active=null,records=[];
const colors={1:'#fff',2:'#35e06f',3:'#39a7ff',4:'#ff4c63',5:'#b56cff',6:'#ffd84d',7:'#39e5e8',8:'#ff8d42',9:'#ff63d7',10:'#9dff8b'};
function redraw(){if(!img)return;x.clearRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
 for(const s of strokes){x.strokeStyle=s.erase?'#000':colors[s.k];x.globalCompositeOperation=s.erase?'destination-out':'source-over';x.lineWidth=s.erase?18:6;x.lineCap='round';x.lineJoin='round';x.beginPath();s.p.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}x.globalCompositeOperation='source-over'}
file.onchange=()=>{const f=file.files[0];if(!f)return;const u=URL.createObjectURL(f);img=new Image();img.onload=()=>{c.width=img.naturalWidth;c.height=img.naturalHeight;strokes=[];redraw();URL.revokeObjectURL(u)};img.src=u}
function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.onpointerdown=e=>{if(!img)return;c.setPointerCapture(e.pointerId);active={k:+document.querySelector('#klass').value,erase:mode==='erase',p:[pt(e)]};strokes.push(active)}
c.onpointermove=e=>{if(!active)return;active.p.push(pt(e));redraw()}
c.onpointerup=()=>active=null;c.onpointercancel=()=>active=null;
document.querySelector('#draw').onclick=()=>mode='draw';document.querySelector('#erase').onclick=()=>mode='erase';
document.querySelector('#undo').onclick=()=>{strokes.pop();redraw()};document.querySelector('#clear').onclick=()=>{strokes=[];redraw()};
function normalized(){return strokes.filter(s=>!s.erase).map(s=>({class_id:s.k,points:s.p.map(p=>({x:+(p.x/c.width).toFixed(6),y:+(p.y/c.height).toFixed(6)}))}))}
document.querySelector('#save').onclick=()=>{if(!img||!file.files[0])return alert('写真を読み込んでください');
 records.push({schema:'palm-ground-truth-v1',image_name:file.files[0].name,width:c.width,height:c.height,created_at:new Date().toISOString(),lines:normalized()});
 document.querySelector('#count').textContent=records.length;document.querySelector('#status').textContent='正解データをメモリへ保存しました。JSON書き出しでファイル化できます。'}
document.querySelector('#export').onclick=()=>{if(!records.length)return alert('保存データがありません');
 const b=new Blob([JSON.stringify({schema:'palm-teacher-batch-v1',label_map:{1:'unknown_crease',2:'life',3:'head',4:'heart',5:'fate',6:'sun',7:'mercury',8:'mars',9:'girdle_of_venus',10:'relationship'},records},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='palm_teacher_batch.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
