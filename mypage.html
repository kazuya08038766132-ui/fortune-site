<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイページ｜総合占い</title><link rel="stylesheet" href="fortune-site-build40.css?v=189"></head><body data-release="SPEC327-BUILD-40-RC278"><a class="skip-link" href="#main">本文へ移動</a><header class="topbar"><div class="shell nav"><a class="brand" href="/">総合占い</a><nav class="navlinks"><a class="keep" href="/">新しく鑑定</a></nav></div></header><main id="main" class="page"><div class="shell"><section class="card page-card"><div class="eyebrow">My Page</div><h1>マイページ</h1><div id="state" aria-live="polite" class="status warn">アカウント情報を読み込んでいます。</div><div id="serviceState" aria-live="polite" class="status warn" style="margin-top:10px">サービス接続状態を確認しています。</div><h2>アカウント</h2><div id="verifyBox" class="status warn">メール確認状態を確認しています。</div><div id="verifyForm" class="actions" style="margin-top:12px;display:none"><input id="verifyEmail" type="email" autocomplete="email" placeholder="メールアドレス" style="min-width:260px"><button id="verifySend" class="btn ghost">確認メールを送る</button></div><div id="verifyMsg" class="mini" aria-live="polite" style="margin-top:8px"></div><h2>購入した鑑定</h2><div id="orders" class="list"></div><h2>データ利用状況</h2><div id="dataSummary" class="status warn">データ利用状況を確認しています。</div><h2>保存した手相</h2><div id="palmHistory" class="status warn">会員用の手相履歴を確認しています。</div><div id="palmCompare" class="mini" style="margin-top:8px"></div><h2>会員状態</h2><div id="membership" aria-live="polite" class="status warn">確認中</div><div class="actions" style="margin-top:16px"><a class="btn primary" href="membership.html">会員登録・毎日占い設定</a><button id="portal" class="btn ghost">会員・支払い管理</button><a class="btn ghost" href="data-consent.html">同意履歴</a></div><div class="devmark">browser-session owned account / SPEC327-BUILD-40-RC278</div></section></div><footer class="shell" style="padding:24px 0 40px"><p class="legal"><a href="/terms.html">利用規約</a> ／ <a href="/privacy.html">プライバシー</a> ／ <a href="/tokusho.html">特定商取引法に基づく表記</a></p></footer></main><script type="module">import {fetchFirstPartySafe as fetchSafe,readFirstPartyJson as readJsonSafe} from './browser-api-safe-build40.js?v=223';import {navigateToStripe} from './external-navigation-safe-build40.js?v=222';
const serviceState=document.querySelector('#serviceState');try{const sr=await fetchSafe('/api/system-status',{credentials:'same-origin',cache:'no-store'}),sj=await readJsonSafe(sr);const c=sj.capabilities||{};const pending=[!c.oneTimeCheckout&&'決済',!c.nameReading&&'姓名',!c.palmProductionReading&&'手相主要線',!c.emailDelivery&&'メール',!c.accountVerification&&'メール確認'].filter(Boolean);serviceState.className='status '+(pending.length?'warn':'ok');serviceState.textContent=pending.length?'準備中：'+pending.join('・'):'主要サービスは利用可能です。';}catch{serviceState.textContent='接続状態を取得できませんでした。';}
const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const state=document.querySelector('#state'),orders=document.querySelector('#orders'),membership=document.querySelector('#membership'),portal=document.querySelector('#portal'),verifyBox=document.querySelector('#verifyBox'),verifyForm=document.querySelector('#verifyForm'),verifyEmail=document.querySelector('#verifyEmail'),verifySend=document.querySelector('#verifySend'),verifyMsg=document.querySelector('#verifyMsg'),dataSummary=document.querySelector('#dataSummary'),palmHistory=document.querySelector('#palmHistory'),palmCompare=document.querySelector('#palmCompare');try{const r=await fetchSafe('/api/me',{credentials:'same-origin',cache:'no-store'}),j=await readJsonSafe(r);if(!r.ok)throw 0;state.className='status ok';state.textContent='このブラウザアカウントに紐づく情報です。';orders.innerHTML=(j.orders||[]).length?(j.orders||[]).map(o=>{const paid=String(o.payment_status||o.status||'pending').toLowerCase()==='paid';const label=paid?'支払済み':'反映待ち';const href=paid?'premium-reading.html?order_id='+encodeURIComponent(o.order_id):'success.html?order_id='+encodeURIComponent(o.order_id);return `<div class="order"><span>${esc(o.order_id)} <span class="pill">${label}</span></span><a href="${href}">${paid?'鑑定を見る':'支払い状態を確認'}</a></div>`}).join(''):'<p class="mini">購入履歴はありません。</p>';if(j.stableAccount){verifyBox.className='status ok';verifyBox.textContent='メール確認済み'+(j.verifiedEmail?'：'+j.verifiedEmail:'');verifyForm.style.display='none';}else{verifyBox.className='status warn';verifyBox.textContent='購入履歴の復旧や毎日占いにはメール確認が必要です。';verifyForm.style.display='flex';}const m=j.membership||{};membership.className=['active','trialing'].includes(m.subscription_status)?'status ok':'status warn';membership.textContent=`会員状態：${m.subscription_status||'inactive'}`;}catch(e){state.className='status bad';state.textContent='マイページAPIへ接続できませんでした。';}
verifySend.addEventListener('click',async()=>{verifyMsg.textContent='';try{const email=verifyEmail.value.trim();if(!email)throw 0;const c=await fetchSafe('/api/csrf-token',{credentials:'same-origin'}),{token}=await readJsonSafe(c);const r=await fetchSafe('/api/account/verification/request',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':token,'Content-Type':'application/json'},body:JSON.stringify({email})}),j=await readJsonSafe(r);if(!r.ok)throw j;verifyMsg.textContent=j.message||'確認メールを送信しました。同じブラウザでリンクを開いてください。';}catch(e){verifyMsg.textContent=e?.error==='stable_account_already_verified'?'このブラウザは既に別の確認済みアカウントに紐づいています。':'確認メールを送信できませんでした。';}});
try{const r=await fetchSafe('/api/my-data-summary',{credentials:'same-origin',cache:'no-store'}),j=await readJsonSafe(r);if(!r.ok)throw 0;const ai=j.consents?.PALM_AI_TRAINING?.accepted===true?'ON':'OFF';const pf=j.dailyFortune?.configured?(j.dailyFortune.enabled?`ON（${j.dailyFortune.sendHourJst}時）`:'OFF'):'未設定';dataSummary.className='status ok';dataSummary.innerHTML=`購入：${esc(j.orders?.paid||0)}件支払済み / 会員：${esc(j.membership?.status||'inactive')}<br>毎日占い：${esc(pf)} / Palm学習同意：${esc(ai)}<br>Palm鑑定用：保持中 ${esc(j.palm?.reading?.active||0)}、削除待ち ${esc(j.palm?.reading?.deletePending||0)} / 学習用：保持中 ${esc(j.palm?.aiTraining?.active||0)}、削除待ち ${esc(j.palm?.aiTraining?.deletePending||0)}`;}catch(e){dataSummary.className='status warn';dataSummary.textContent='データ利用状況を取得できませんでした。';}

async function loadPalmHistory(){try{const r=await fetchSafe('/api/build40/palm/history',{credentials:'same-origin',cache:'no-store'}),j=await readJsonSafe(r);if(r.status===403){palmHistory.className='status warn';palmHistory.textContent='手相写真の履歴保存は月額会員限定です。';palmCompare.textContent='';return}if(!r.ok)throw 0;const items=j.items||[];palmHistory.className='status ok';const lineLabel={life:'生命線',head:'知能線',heart:'感情線',fate:'運命線',sun:'太陽線',wealth:'財運線',marriage:'結婚線'};palmHistory.innerHTML=items.length?items.map(x=>{const ok=(x.confirmedLines||[]).map(k=>lineLabel[k]||k).join('・'),hold=(x.pendingLines||[]).map(k=>lineLabel[k]||k).join('・');return `<div class="order palm-history-entry"><span>保存写真 #${esc(x.assetId)} <span class="pill">${esc(x.state==='uploaded'?'保存済み':x.state)}</span><br><span class="mini">${esc(new Date(x.capturedAt).toLocaleString('ja-JP'))}</span>${ok?`<br><span class="mini">鑑定に反映：${esc(ok)}</span>`:''}${hold?`<br><span class="mini">今回判定保留：${esc(hold)}</span>`:''}${x.comparisonReady&&!x.historyEvidencePresent?`<br><span class="mini">この鑑定は安定性表示対応前の履歴です。</span>`:''}</span><button class="btn ghost palm-delete" data-id="${esc(x.assetId)}">削除</button></div>`}).join(''):'保存した手相写真はありません。';if(j.comparison?.ready){const c=j.comparison,parts=[];if(c.status==='RETAKE_REQUIRED'){parts.push('撮影条件による解析差の可能性があります。同じ条件で再撮影してください。');}else{if(c.stableTags?.length)parts.push('安定して確認できた特徴: '+c.stableTags.join('・'));if(c.supplementaryTags?.length)parts.push('今回の撮影でも確認できた補助的特徴: '+c.supplementaryTags.join('・'));}palmCompare.textContent=parts.join(' / ')||c.note||'主要な鑑定傾向は安定しています。';}else palmCompare.textContent=items.length>=2?'安定性の参照には鑑定結果が保存された写真が2件必要です。':'履歴は過去鑑定の保存・閲覧用です。安定性の参照には保存写真が2件以上必要です。';document.querySelectorAll('.palm-delete').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('この手相写真を削除しますか？'))return;const c=await fetchSafe('/api/csrf-token',{credentials:'same-origin'}),{token}=await readJsonSafe(c);const d=await fetchSafe('/api/build40/palm/'+encodeURIComponent(b.dataset.id),{method:'DELETE',credentials:'same-origin',headers:{'X-CSRF-Token':token}});if(d.ok)await loadPalmHistory();}));}catch{palmHistory.className='status warn';palmHistory.textContent='手相履歴を取得できませんでした。';}}
await loadPalmHistory();

portal.addEventListener('click',async()=>{try{const c=await fetchSafe('/api/csrf-token',{credentials:'same-origin'}),{token}=await readJsonSafe(c);const r=await fetchSafe('/api/my-customer-portal',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':token,'Content-Type':'application/json'},body:'{}'}),j=await readJsonSafe(r);if(!r.ok||!j.url)throw 0;navigateToStripe(j.url)}catch(e){membership.className='status warn';membership.textContent='有効な会員またはStripe顧客情報が確認できません。';}});
</script></body></html>
