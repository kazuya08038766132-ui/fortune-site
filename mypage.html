<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイページ｜総合占い</title>
<style>body{font-family:system-ui;background:#090b24;color:#eee;margin:0;padding:24px}main{max-width:760px;margin:auto}.card{border:1px solid #d9b75b;border-radius:16px;padding:18px;margin:14px 0;background:#17113d}a,button{color:#ffe39a}button{background:#5427a8;border:1px solid #d9b75b;padding:12px;border-radius:10px}</style></head>
<body><main><h1>マイページ</h1><div class="card"><h2>プレミアム会員</h2><div id="membership">確認中…</div><button id="manage" style="display:none">会員情報・解約を管理</button></div>
<div class="card"><h2>購入済み詳細鑑定</h2><div id="order">この端末に購入情報がありません。</div></div><p><a href="/">鑑定ページへ戻る</a></p></main>
<script>
let membership=null;try{membership=JSON.parse(localStorage.getItem('fortune_membership_v1')||'null')}catch{}
let paid=null;try{paid=JSON.parse(localStorage.getItem('fortune_paid_result_v1')||'null')}catch{}
const mb=document.getElementById('membership'),manage=document.getElementById('manage');
if(membership?.id){fetch('/api/membership/'+encodeURIComponent(membership.id)).then(r=>r.json()).then(d=>{membership=d;mb.textContent='状態：'+d.status+(d.current_period_end?' / 次回期間：'+new Date(d.current_period_end).toLocaleDateString('ja-JP'):'');if(['active','trialing'].includes(d.status)){manage.style.display='inline-block'}}).catch(()=>mb.textContent='会員状態を確認できませんでした。')}else mb.textContent='会員登録はありません。';
if(paid?.id)document.getElementById('order').textContent='注文ID：'+paid.id+' / 決済確認済み';
manage.onclick=async()=>{const r=await fetch('/api/create-customer-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({membershipId:membership.id})});const d=await r.json();if(d.url)location.href=d.url;else alert(d.error||'管理画面を開けませんでした');};
</script></body></html>
