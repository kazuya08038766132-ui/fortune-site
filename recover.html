<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>購入履歴の確認</title></head><body data-release="SPEC327-BUILD-40-RC278"><a class="skip-link" href="#main">本文へ移動</a><main id="main"><h1>購入履歴の確認</h1><p id="s">確認しています…</p><p><button id="retry" type="button">もう一度確認</button> <a href="/mypage.html">確認メールを再送・マイページへ</a></p></main><script type="module">
const s=document.querySelector("#s"),retry=document.querySelector("#retry");
import {fetchFirstPartySafe as fetchSafe,readFirstPartyJson as readJsonSafe} from './browser-api-safe-build40.js?v=223';
const p=new URLSearchParams(location.hash.slice(1)),token=p.get("recovery_token");
history.replaceState(null,"",location.pathname);
async function consume(){if(!token){s.textContent="確認リンクが無効です。";return;}try{
 const c=await fetchSafe("/api/csrf-token-v2",{credentials:"same-origin",cache:"no-store"}); const {token:csrf}=await readJsonSafe(c);
 const r=await fetchSafe("/api/account/recovery/consume",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-CSRF-Token":csrf},body:JSON.stringify({token})});
 if(!r.ok)throw Error(); s.textContent="確認できました。マイページへ移動します。"; location.replace("/mypage.html");
}catch{s.textContent="リンクが無効・期限切れ、または通信に失敗しました。マイページから確認メールを再送するか、通信状態を確認してもう一度お試しください。";}}
retry.addEventListener("click",consume);consume();
</script></body></html>
