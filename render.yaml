services:
  - type: web
    name: fortune-site
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fortune-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DETAIL_PRICE_YEN
        value: "980"

databases:
  - name: fortune-db
    plan: free
