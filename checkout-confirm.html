<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>購入内容の最終確認｜総合占い</title>
<style>body{margin:0;background:linear-gradient(180deg,#080821,#120a31);color:#f3efff;font-family:system-ui,-apple-system,sans-serif;line-height:1.85}main{max-width:860px;margin:auto;padding:92px 20px 70px}a{color:#f3d986}h1{color:#f3d986}.box{background:rgba(22,16,57,.9);border:1px solid #8f7638;border-radius:18px;padding:22px;margin:18px 0}.nav{position:fixed;top:0;left:0;right:0;padding:16px 20px;background:#090b24f2;border-bottom:1px solid #594b2d}.note{padding:12px 14px;border-left:3px solid #f3d986;background:#1c1646;border-radius:8px}</style></head><body>
<div class="nav"><a href="/">← 総合占いへ戻る</a></div><main><h1>購入内容の最終確認</h1><div class="box">
<p class="note">開発確認：SPEC195-BUILD-30 ｜ 決済CSRF・所有権導線修正</p>
<p><b>商品：</b><span id="productName">総合詳細鑑定</span></p><p><b>数量：</b>1</p><p><b>価格：</b><span id="price">980円（税込）</span></p>
<p><b>支払時期：</b><span id="payTiming">申込み時</span></p><p><b>提供時期：</b>決済確認後、原則直ちに提供</p><p><b>自動更新：</b><span id="renewal">なし</span></p>
<p><a href="/refund.html">返金・キャンセル条件</a> / <a href="/legal.html">特定商取引法に基づく表記</a></p>
<label style="display:flex;gap:10px"><input id="confirm" type="checkbox"><span>購入内容と利用規約を確認しました。</span></label>
<button id="go" disabled style="width:100%;padding:15px;margin-top:18px;border-radius:14px;background:#6f45d8;color:#fff">決済へ進む</button></div></main>
<script>
const q=new URLSearchParams(location.search),monthly=q.get('product')==='membership';
if(monthly){productName.textContent='月額会員';price.textContent='490円（税込）/月';payTiming.textContent='申込み時および各更新日';renewal.textContent='解約まで月単位で自動更新'}
confirm.onchange=()=>go.disabled=!confirm.checked;
async function csrf(){const r=await fetch('/api/csrf-token',{credentials:'same-origin'}),d=await r.json();if(!r.ok||!d.token)throw Error('安全確認を開始できません');return d.token}
go.onclick=async()=>{go.disabled=true;go.textContent='決済画面を準備しています…';try{
 const token=await csrf(),payload=monthly?{consent:true}:{reading:{birth:localStorage.getItem('fortune_birth')||'',theme:localStorage.getItem('fortune_theme')||'総合',question:localStorage.getItem('fortune_question')||''}};
 const endpoint=monthly?'/api/create-subscription-checkout':'/api/create-checkout-session';
 const r=await fetch(endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':token},body:JSON.stringify(payload)}),d=await r.json();
 if(!r.ok)throw Error(d.error||'決済画面を開始できません');if(!d.url)throw Error('決済URLを取得できません');location.href=d.url;
}catch(e){alert(e.message);go.disabled=false;go.textContent='決済へ進む'}};
</script></body></html>
