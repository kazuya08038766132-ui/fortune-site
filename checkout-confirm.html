<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お支払い確認｜総合占い</title><link rel="stylesheet" href="fortune-site-build40.css?v=189"></head><body data-release="SPEC327-BUILD-40-RC278"><a class="skip-link" href="#main">本文へ移動</a><header class="topbar"><div class="shell nav"><a class="brand" href="/">総合占い</a><nav class="navlinks"><a class="keep" href="/">戻る</a></nav></div></header><main id="main" class="page"><div class="shell"><section class="card page-card"><div class="eyebrow">Checkout</div><h1>詳細鑑定のお支払い</h1><p>買い切り <strong>980円</strong>。決済成功ページへ戻っただけでは鑑定は解放されず、サーバー側で支払い済み・このブラウザアカウント所有の注文であることを確認します。</p><div id="draftBox" class="status warn">無料鑑定データを確認しています。</div><div class="premium"><div class="price">¥980</div><p>総合占い 詳細鑑定（1回買い切り）</p></div><label class="check" style="margin:18px 0"><input id="finalCheck" type="checkbox"><span>価格・支払時期・サービス提供時期・キャンセル条件、利用規約、プライバシーポリシー、特定商取引法に基づく表記を確認しました。入力内容を訂正する場合は前の画面へ戻れます。</span></label><div class="actions"><button id="pay" class="btn gold" disabled>Stripeで980円を支払う</button><a class="btn ghost" href="/">入力を修正する</a></div><div id="state" aria-live="polite" class="status warn" style="margin-top:16px">決済はまだ開始されていません。</div><p class="legal"><a href="/terms.html">利用規約</a> ／ <a href="/privacy.html">プライバシーポリシー</a> ／ <a href="/tokusho.html">特定商取引法に基づく表記</a></p><div class="devmark">SPEC327-BUILD-40-RC278</div></section></div></main><script type="module">
import {loadFortuneDraft} from './fortune-draft-store-build40.js';
const loaded=loadFortuneDraft(),draft=loaded.status==='OK'?loaded.draft:null,box=document.querySelector('#draftBox'),pay=document.querySelector('#pay'),check=document.querySelector('#finalCheck'),state=document.querySelector('#state');
let paymentReady=false;
import {fetchFirstPartySafe as fetchSafe,readFirstPartyJson as readJsonSafe} from './browser-api-safe-build40.js?v=223';import {navigateToStripe} from './external-navigation-safe-build40.js?v=222';
try{const sr=await fetchSafe('/api/system-status',{credentials:'same-origin',cache:'no-store'}),sj=await readJsonSafe(sr);paymentReady=!!(sr.ok&&sj?.capabilities?.oneTimeCheckout);if(!paymentReady){state.className='status warn';state.textContent='現在、決済接続は準備中です。無料鑑定データは保持されます。';}}catch{paymentReady=false;}
if(draft?.birthDate){box.className='status ok';box.textContent=`${draft.familyName||""}${draft.givenName||""} / ${draft.birthDate} の無料鑑定データを引き継ぎます。`}else{box.className='status bad';box.textContent='無料鑑定データがありません。先にトップページで鑑定してください。'}
check.addEventListener('change',()=>pay.disabled=!check.checked||!draft?.birthDate||!paymentReady);
function checkoutKey(){const k='fortune_checkout_detail_key';let v=sessionStorage.getItem(k);if(!v){v=crypto.randomUUID();sessionStorage.setItem(k,v)}return {storageKey:k,value:v}}
pay.addEventListener('click',async()=>{if(!paymentReady){state.className='status warn';state.textContent='決済接続は現在準備中です。';return;}pay.disabled=true;state.className='status warn';state.textContent='安全な決済ページを準備しています…';const idem=checkoutKey();try{const c=await fetchSafe('/api/csrf-token',{credentials:'same-origin'});if(!c.ok)throw new Error('csrf');const {token}=await readJsonSafe(c);const r=await fetchSafe('/api/create-checkout-session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':token,'X-Idempotency-Key':idem.value},body:JSON.stringify({reading:draft})});const j=await readJsonSafe(r);if(r.status===409&&j.error==='checkout_attempt_terminal'){if(['processing','paid'].includes(j.state)&&j.resourceId){sessionStorage.removeItem(idem.storageKey);location.href=`/success.html?order_id=${encodeURIComponent(j.resourceId)}`;return;}if(['failed','expired','canceled'].includes(j.state)){sessionStorage.removeItem(idem.storageKey);state.className='status warn';state.textContent='前回の決済試行は終了しています。もう一度押すと新しい決済を開始します。';pay.disabled=false;return;}}if(!r.ok||!j.url)throw new Error(j.error||'checkout');sessionStorage.removeItem(idem.storageKey);navigateToStripe(j.url)}catch(e){state.className='status bad';state.textContent='決済を開始できませんでした。同じ購入試行として安全に再試行できます。';pay.disabled=false;}});
</script></body></html>
