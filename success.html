<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お支払い確認中｜総合占い</title><link rel="stylesheet" href="fortune-site-build40.css?v=189"></head><body data-release="SPEC327-BUILD-40-RC278"><a class="skip-link" href="#main">本文へ移動</a><main id="main" class="page"><div class="shell"><section class="card page-card"><div class="eyebrow">Payment Confirmation</div><h1>お支払いを確認しています</h1><div id="state" aria-live="polite" class="status warn">サーバー側の支払い状態を確認中です。</div><p id="hint" class="mini">決済直後はWebhookの反映に少し時間がかかる場合があります。このページで自動的に再確認します。</p><div id="reading" class="results"></div><div class="actions" style="margin-top:20px"><button id="retry" class="btn primary" hidden>もう一度確認</button><a class="btn ghost" href="mypage.html">マイページへ</a><a class="btn ghost" href="/">トップへ</a></div><div class="devmark">success URLだけでは解放しません / SPEC327-BUILD-40-RC278</div></section></div><footer class="shell" style="padding:24px 0 40px"><p class="legal"><a href="/terms.html">利用規約</a> ／ <a href="/privacy.html">プライバシー</a> ／ <a href="/tokusho.html">特定商取引法に基づく表記</a></p></footer></main><script type="module">
import {SETTLEMENT_POLL_DELAYS_MS,normalizeOrderSettlement} from './settlement-poll-build40.js?v=138';
const p=new URLSearchParams(location.search),id=p.get('order_id'),state=document.querySelector('#state'),reading=document.querySelector('#reading'),retry=document.querySelector('#retry'),hint=document.querySelector('#hint');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sleep=ms=>new Promise(r=>setTimeout(r,ms));import {fetchFirstPartySafe as fetchSafe,readFirstPartyJson as readJsonSafe} from './browser-api-safe-build40.js?v=223';let running=false;
async function unlock(){const r=await fetchSafe('/api/my-order-reading/'+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store'});const j=await readJsonSafe(r);if(!r.ok)throw new Error('unlock');state.className='status ok';state.textContent='支払いと注文所有権を確認しました。';hint.textContent='詳細鑑定を表示できます。';reading.classList.add('show');reading.innerHTML='<div class="premium"><h2>詳細鑑定が解放されました</h2><p>注文 '+esc(id)+' の鑑定データを確認しました。</p><a class="btn gold" href="premium-reading.html?order_id='+encodeURIComponent(id)+'">詳細鑑定を見る</a></div>';retry.hidden=true;}
async function checkLoop(){if(running||!id)return;running=true;retry.hidden=true;try{for(let i=0;i<SETTLEMENT_POLL_DELAYS_MS.length;i++){if(SETTLEMENT_POLL_DELAYS_MS[i])await sleep(SETTLEMENT_POLL_DELAYS_MS[i]);const r=await fetchSafe('/api/my-order-status/'+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store'});if(r.status===404){state.className='status bad';state.textContent='このブラウザの注文として確認できませんでした。';return}if(!r.ok)throw new Error('status');const j=await readJsonSafe(r),x=normalizeOrderSettlement(j);if(x.state==='PAID'){await unlock();return}if(x.state==='FAILED'){state.className='status bad';state.textContent='決済が完了していません。マイページから状態を確認してください。';retry.hidden=false;return}state.className='status warn';state.textContent=`支払い反映待ちです。自動確認中… (${i+1}/${SETTLEMENT_POLL_DELAYS_MS.length})`;}
state.className='status warn';state.textContent='まだ支払い反映を確認できません。決済済みの場合は少し時間をおいて再確認してください。';retry.hidden=false;}catch(e){state.className='status bad';state.textContent='確認APIへ接続できませんでした。';retry.hidden=false;}finally{running=false}}
retry.addEventListener('click',checkLoop);if(!id){state.className='status bad';state.textContent='注文IDがありません。';hint.textContent='マイページから購入履歴を確認してください。';}else checkLoop();
</script></body></html>
