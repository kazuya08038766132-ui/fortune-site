<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>購入完了｜総合占い</title>
<style>body{margin:0;background:linear-gradient(180deg,#080821,#150b37);color:#f4f0ff;font-family:system-ui;line-height:1.8}.w{max-width:720px;margin:auto;padding:80px 18px}.c{background:#17113d;border:1px solid #91783e;border-radius:22px;padding:28px;text-align:center}h1{color:#f3d986}.b{display:block;padding:14px;margin:12px 0;border-radius:12px;background:#7047d9;color:#fff;text-decoration:none}.dev{color:#f3d986}</style></head>
<body><main class="w"><section class="c"><p class="dev">開発確認：SPEC195-BUILD-30 ｜ success URL単独解放を廃止</p><h1>詳細鑑定の購入を確認しています</h1><p id="msg">Stripeの支払い反映を確認中です。</p><div id="actions"></div></section></main>
<script>
(async()=>{const id=new URLSearchParams(location.search).get('order_id');if(!id){msg.textContent='注文番号を確認できません。';actions.innerHTML='<a class="b" href="/mypage.html">マイページへ</a>';return}
for(let i=0;i<8;i++){try{const r=await fetch('/api/my-order-reading/'+encodeURIComponent(id),{credentials:'same-origin'});if(r.ok){msg.textContent='支払い済み注文を確認しました。';actions.innerHTML=`<a class="b" href="/premium-reading.html?order_id=${encodeURIComponent(id)}">総合詳細鑑定を開く</a><a class="b" href="/mypage.html">マイページへ</a>`;return}if(r.status===403||r.status===404){await new Promise(x=>setTimeout(x,1500));continue}}catch(_){await new Promise(x=>setTimeout(x,1500))}}
msg.textContent='決済反映を確認中です。少し時間を置いてマイページから確認してください。';actions.innerHTML='<a class="b" href="/mypage.html">マイページへ</a>'})();
</script></body></html>
