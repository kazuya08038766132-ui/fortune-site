<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会員登録確認｜総合占い</title><link rel="stylesheet" href="fortune-site-build40.css?v=189"></head><body data-release="SPEC327-BUILD-40-RC278"><a class="skip-link" href="#main">本文へ移動</a><main id="main" class="page"><div class="shell"><section class="card page-card"><div class="eyebrow">Membership</div><h1>会員状態を確認しています</h1><div id="state" aria-live="polite" class="status warn">success URLだけでは有効化せず、サーバー状態を確認します。</div><p id="hint" class="mini">決済直後は会員状態の反映に少し時間がかかる場合があります。このページで自動的に再確認します。</p><div class="actions" style="margin-top:18px"><button id="retry" class="btn primary" hidden>もう一度確認</button><a class="btn ghost" href="membership.html">会員設定へ</a><a class="btn ghost" href="mypage.html">マイページへ</a></div><div class="devmark">SPEC327-BUILD-40-RC278</div></section></div><footer class="shell" style="padding:24px 0 40px"><p class="legal"><a href="/terms.html">利用規約</a> ／ <a href="/privacy.html">プライバシー</a> ／ <a href="/tokusho.html">特定商取引法に基づく表記</a></p></footer></main><script type="module">
import {SETTLEMENT_POLL_DELAYS_MS,normalizeMembershipSettlement} from './settlement-poll-build40.js?v=120';
const s=document.querySelector('#state'),retry=document.querySelector('#retry'),hint=document.querySelector('#hint'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let running=false;import {fetchFirstPartySafe as fetchSafe,readFirstPartyJson as readJsonSafe} from './browser-api-safe-build40.js?v=223';
async function checkLoop(){if(running)return;running=true;retry.hidden=true;try{for(let i=0;i<SETTLEMENT_POLL_DELAYS_MS.length;i++){if(SETTLEMENT_POLL_DELAYS_MS[i])await sleep(SETTLEMENT_POLL_DELAYS_MS[i]);const r=await fetchSafe('/api/membership-status',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error('status');const j=await readJsonSafe(r),x=normalizeMembershipSettlement(j);if(x.state==='ACTIVE'){s.className='status ok';s.textContent='会員状態を確認しました。';hint.textContent='毎日占いの配信設定や会員管理を利用できます。';return}if(x.state==='FAILED'){s.className='status bad';s.textContent='会員登録が有効になっていません。';retry.hidden=false;return}s.className='status warn';s.textContent=`会員状態の反映待ちです。自動確認中… (${i+1}/${SETTLEMENT_POLL_DELAYS_MS.length})`;}
s.className='status warn';s.textContent='まだ会員状態を確認できません。決済済みの場合は少し時間をおいて再確認してください。';retry.hidden=false;}catch(e){s.className='status bad';s.textContent='会員状態を確認できませんでした。';retry.hidden=false;}finally{running=false}}
retry.addEventListener('click',checkLoop);checkLoop();
</script></body></html>
