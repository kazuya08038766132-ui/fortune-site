<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会員登録確認</title><body style="font-family:system-ui;background:#090b24;color:#fff;padding:30px">
<main style="max-width:680px;margin:auto"><h1>会員登録を確認しています</h1><div id="status">少々お待ちください。</div></main>
<script>
const id=new URLSearchParams(location.search).get('membership_id');
async function check(){
 const r=await fetch('/api/membership/'+encodeURIComponent(id)); if(!r.ok){setTimeout(check,1800);return}
 const d=await r.json();
 if(['active','trialing'].includes(d.status)){
  localStorage.setItem('fortune_membership_v1',JSON.stringify(d));
  document.getElementById('status').innerHTML='<h2>プレミアム会員登録完了</h2><p>月額会員機能を利用できます。</p><a style="color:#f4df9a" href="/">鑑定ページへ戻る</a> ｜ <a style="color:#f4df9a" href="/mypage.html">マイページ</a>';return;
 }
 document.getElementById('status').textContent='決済状態を確認しています…';setTimeout(check,1800);
}
if(id)check(); else document.getElementById('status').textContent='会員IDがありません。';
</script></body></html>
