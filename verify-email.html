<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メール確認｜総合占い</title><link rel="stylesheet" href="fortune-site-build40.css?v=189"></head><body data-release="SPEC327-BUILD-40-RC278"><a class="skip-link" href="#main">本文へ移動</a><header class="topbar"><div class="shell nav"><a class="brand" href="/">総合占い</a></div></header><main id="main" class="page"><div class="shell"><section class="card page-card"><div class="eyebrow">Email Verification</div><h1>メールアドレス確認</h1><div id="state" class="status warn" aria-live="polite">確認しています。</div><p class="mini">安全のため、確認メールを送信したときと同じブラウザで開いてください。</p><div class="actions"><button id="retry" class="btn primary" type="button">もう一度確認</button><a class="btn ghost" href="mypage.html">確認メールを再送・マイページへ</a></div><div class="devmark">SPEC327-BUILD-40-RC278</div></section></div></main><script type="module">const state=document.querySelector('#state'),retry=document.querySelector('#retry'),token=new URLSearchParams(location.search).get('token')||'';let running=false;import {fetchFirstPartySafe as fetchSafe,readFirstPartyJson as readJsonSafe} from './browser-api-safe-build40.js?v=223';async function consume(){if(running)return;running=true;retry.disabled=true;try{if(!token)throw new Error('missing');const c=await fetchSafe('/api/csrf-token',{credentials:'same-origin',cache:'no-store'});if(!c.ok)throw new Error('network');const cj=await readJsonSafe(c);const r=await fetchSafe('/api/account/verification/consume',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':cj.token,'Content-Type':'application/json'},body:JSON.stringify({token})}),j=await readJsonSafe(r).catch(()=>({}));if(!r.ok){state.className='status bad';state.textContent=j.error==='verification_same_browser_required'?'この確認リンクは、確認メールを送信したブラウザで開いてください。':'確認リンクが無効または期限切れです。マイページから確認メールを再送してください。';}else{state.className='status ok';state.textContent='メールアドレスを確認しました。購入履歴・会員情報をこのアカウントで復旧できます。';setTimeout(()=>location.href='mypage.html',1200);}}catch(e){state.className='status bad';state.textContent=e?.message==='network_timeout'?'通信がタイムアウトしました。通信状態を確認してもう一度お試しください。':'確認リンクを処理できませんでした。通信状態を確認してもう一度お試しください。';}finally{running=false;retry.disabled=false}}retry.addEventListener('click',consume);consume();</script></body></html>
